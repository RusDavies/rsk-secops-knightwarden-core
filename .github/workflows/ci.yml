name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run boundary checks
        run: |
          python scripts/check_core_boundary.py
          python scripts/check_external_workflow_reference_model.py
          python scripts/check_normalized_external_approval_vocabulary.py

      - name: Run tests
        run: python -m unittest discover -s tests
