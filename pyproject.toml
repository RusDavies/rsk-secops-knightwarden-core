[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "knightwarden-core"
version = "0.1.0"
description = "KnightWarden governance primitives."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"

[tool.setuptools.packages.find]
where = ["src"]
